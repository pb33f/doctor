<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{.Page.Title}}</title>
{{with .Page.Description}}<meta name="description" content="{{.}}">{{end}}
{{with .Page.MarkdownHref}}<link rel="alternate" type="text/markdown" href="{{.}}">{{end}}
{{with .Site.Brand}}{{with .Favicon}}<link rel="icon" href="{{$.Page.Root}}{{.}}">{{end}}{{end}}
<link rel="stylesheet" href="{{.Head.Asset "simple.css"}}">
<link rel="stylesheet" href="{{.Head.Static "chroma.css"}}">
</head>
