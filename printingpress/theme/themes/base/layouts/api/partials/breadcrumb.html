{{/* breadcrumb.html draws a page's breadcrumb: plain markup, so it is in place before any script runs. Data: render.BreadcrumbArgs. */}}<nav class="pp-breadcrumb" aria-label="Breadcrumb">{{$last := len .Items | add -1}}{{range $i, $item := .Items}}<span class="pp-breadcrumb-item">{{if $item.Href}}<a class="pp-breadcrumb-label" href="{{docHref $.Base $item.Href}}"{{if eq $i $last}} aria-current="page"{{end}}>{{$item.Label}}</a>{{else}}<span class="pp-breadcrumb-label"{{if eq $i $last}} aria-current="page"{{end}}>{{$item.Label}}</span>{{end}}{{if lt $i $last}}<span class="pp-breadcrumb-separator" aria-hidden="true"><wa-icon name="chevron-right"></wa-icon></span>{{end}}</span>{{end}}</nav>
