<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>{{.Page.Title}}</title>{{with .Page.Description}}<meta name="description" content="{{.}}">{{end}}{{with .Page.MarkdownHref}}<link rel="alternate" type="text/markdown" href="{{.}}">{{end}}{{with .Head.BaseHref}}<base href="{{.}}">{{end}}<link rel="stylesheet" href="{{.Head.Static "webawesome.css"}}">{{/* Page styles go in a layer below the component styles, so their element rules stay out of the components, as shadow DOM kept them out. */}}<style>@layer pp-base, pp-host, page, pp-reset, pp-host-nested;@import url("{{.Head.Static "printing-press.css"}}") layer(page);@import url("{{.Head.Static "chroma.css"}}") layer(page);{{range .Head.Extra}}@import url("{{.}}") layer(page);{{end}}</style><link rel="stylesheet" href="{{.Head.Static "printing-press-components.css"}}"><link rel="stylesheet" href="{{.Head.Static "printing-press-ui.css"}}"><script defer src="{{.Head.Script}}"></script></head>
