{{/* warnings.html lists the specifications whose render was skipped. Data: the engine's warnings view. */}}
<pp-attention-box class="pp-catalog-warning" type="warning" headerText="{{.Heading}}">
	{{if eq (len .Items) 1}}
		<p>{{index .Items 0}}</p>
	{{else}}
		<ul class="pp-catalog-warning-list">{{range .Items}}<li>{{.}}</li>{{end}}</ul>
	{{end}}
</pp-attention-box>
