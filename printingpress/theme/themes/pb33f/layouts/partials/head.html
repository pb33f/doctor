<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><script>
			(function() {
				try {
					var root = document.documentElement;
					var storedTheme = localStorage.getItem('pb33f-theme');
					var theme = storedTheme === 'tektronix' ? 'tektronix' : (storedTheme === 'light' ? 'light' : 'dark');
					var splitPos = sessionStorage.getItem('pp-split-position');
					root.setAttribute('theme', theme);
					root.style.setProperty('--pp-split-position', splitPos ? splitPos + '%' : '20%');
					if (theme === 'light') {
						root.classList.remove('sl-theme-dark');
					} else {
						root.classList.add('sl-theme-dark');
					}
				} catch (_) {}
			})();
		</script><title>{{.Page.Title}}</title>{{with .Page.Description}}<meta name="description" content="{{.}}">{{end}}{{with .Page.MarkdownHref}}<link rel="alternate" type="text/markdown" href="{{.}}">{{end}}{{with .Head.BaseHref}}<base href="{{.}}">{{end}}<link rel="stylesheet" href="{{.Head.Static "pb33f-theme.css"}}"><link rel="stylesheet" href="{{.Head.Static "cowboy-components.css"}}"><link rel="stylesheet" href="{{.Head.Static "shoelace-dark.css"}}"><link rel="stylesheet" href="{{.Head.Static "printing-press.css"}}"><link rel="stylesheet" href="{{.Head.Static "chroma.css"}}">{{range .Head.Extra}}<link rel="stylesheet" href="{{.}}">{{end}}<script defer src="{{.Head.Script}}"></script></head>
